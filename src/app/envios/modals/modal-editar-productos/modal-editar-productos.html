<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"
     (click)="cerrar.emit()">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6"
       (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <div>
        <h3 class="text-base font-extrabold text-black">Editar productos</h3>
        <p class="text-xs text-slate-400 mt-0.5">{{ forms().length }} producto(s) en este envío</p>
      </div>
      <button (click)="cerrar.emit()"
        class="w-8 h-8 flex items-center cursor-pointer justify-center rounded-lg border border-slate-200 text-slate-400 hover:text-black hover:bg-slate-50 transition-all">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Lista de productos -->
    <div class="flex flex-col gap-3 max-h-[60vh] overflow-y-auto pr-1 mb-4">
      @for (form of forms(); track form.id) {
        <div class="p-4 border border-slate-100 rounded-xl bg-slate-50 flex flex-col gap-3">

          <span class="text-xs font-bold text-slate-500 uppercase">Producto {{ $index + 1 }}</span>

          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Tipo</label>
            <select [(ngModel)]="form.tipoProductoId"
              class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black transition-all bg-white">
              <option [ngValue]="0">Seleccionar...</option>
              @for (tipo of tiposProducto(); track tipo.id) {
                <option [ngValue]="tipo.id">{{ tipo.nombre }}</option>
              }
            </select>
          </div>

          <div class="flex gap-3">
            <div class="flex flex-col gap-1.5 flex-1">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">N° paquetes</label>
              <input [(ngModel)]="form.numeroPaquetes" type="number" min="1"
                class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black transition-all"/>
            </div>
            <div class="flex flex-col gap-1.5 flex-1">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Subtotal</label>
              <div class="px-4 py-2.5 border border-slate-100 rounded-xl text-sm bg-white text-slate-600 font-bold">
                S/. {{ subtotal(form) | number:'1.2-2' }}
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Descripción</label>
            <textarea [(ngModel)]="form.descripcion" rows="2"
              class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black transition-all resize-none"></textarea>
          </div>

        </div>
      }
    </div>

    <!-- Total -->
    <div class="flex justify-between items-center px-1 mb-4">
      <span class="text-xs font-bold text-slate-500 uppercase tracking-wide">Total estimado</span>
      <span class="text-base font-extrabold text-black">S/. {{ totalEstimado | number:'1.2-2' }}</span>
    </div>

    @if (error()) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-600 flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error() }}
      </div>
    }

    <!-- Botones -->
    <div class="flex gap-2">
      <button (click)="cerrar.emit()"
        class="flex-1 py-2.5 cursor-pointer border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50 transition-all">
        Cancelar
      </button>
      <button (click)="guardar()" [disabled]="guardando()"
        class="flex-1 py-2.5 cursor-pointer bg-black text-white rounded-xl text-sm font-bold hover:bg-slate-800 transition-all disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        @if (guardando()) {
          <i class="fa fa-spinner fa-spin"></i> Guardando...
        } @else {
          Actualizar todo
        }
      </button>
    </div>

  </div>
</div>
