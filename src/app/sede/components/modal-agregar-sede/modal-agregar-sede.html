<div class="fixed inset-0 z-50 flex items-center justify-center p-4">

  <!-- OVERLAY -->
  <div
    class="absolute inset-0 bg-black/40 backdrop-blur-sm cursor-pointer"
    (click)="onCerrar()">
  </div>

  <!-- PANEL -->
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">

    <!-- HEADER -->
    <div class="flex items-center justify-between p-6 border-b border-slate-100">
      <div>
        <h3 class="text-base font-extrabold text-black">
          {{ modoEditar ? 'Editar sede' : 'Nueva sede' }}
        </h3>
        <p class="text-xs text-slate-500 mt-0.5">
          {{ modoEditar ? 'Modifica los datos de la sede.' : 'Completa los datos de la nueva sede.' }}
        </p>
      </div>
      <button
        (click)="onCerrar()"
        class="cursor-pointer p-2 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-black transition-all">
        <i class="fa fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- BODY -->
    <div class="p-6 flex flex-col gap-4">

      @if (errorMsg()) {
        <div class="p-3 bg-red-50 border border-red-200 rounded-xl flex items-center gap-2 text-red-700 text-xs font-medium">
          <i class="fa fa-circle-exclamation text-red-400"></i>
          {{ errorMsg() }}
        </div>
      }

      <!-- NOMBRE -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Nombre de la sede</label>
        <input
          [(ngModel)]="form.nombre"
          type="text"
          placeholder="Ej: Sede Central Cajamarca"
          class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
      </div>

      <!-- PROVINCIA -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Provincia</label>
        <select
          [(ngModel)]="form.provincia"
          class="cursor-pointer px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all bg-white">
          <option value="">Seleccionar provincia...</option>
          @for (prov of provincias; track prov) {
            <option [value]="prov">{{ prov }}</option>
          }
        </select>
      </div>

      <!-- DIRECCIÓN -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Dirección</label>
        <input
          [(ngModel)]="form.direccion"
          type="text"
          placeholder="Ej: Jr. Apurímac 123, Cajamarca"
          class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
      </div>

      <!-- TELÉFONO -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Teléfono</label>
        <input
          [(ngModel)]="form.telefono"
          type="text"
          placeholder="Ej: 076-123456"
          class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
      </div>

      <!-- CHECKBOXES -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Opciones</label>

        <label class="cursor-pointer flex items-center gap-3 p-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-all">
          <input
            [(ngModel)]="form.esPrincipal"
            type="checkbox"
            class="cursor-pointer w-4 h-4 accent-black rounded"/>
          <div>
            <span class="text-sm font-semibold text-black">Sede principal</span>
            <p class="text-xs text-slate-400">Sede central o matriz de la empresa.</p>
          </div>
        </label>

        <label class="cursor-pointer flex items-center gap-3 p-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-all">
          <input
            [(ngModel)]="form.tieneRecojo"
            type="checkbox"
            class="cursor-pointer w-4 h-4 accent-black rounded"/>
          <div>
            <span class="text-sm font-semibold text-black">Tiene recojo</span>
            <p class="text-xs text-slate-400">Los clientes pueden recoger sus paquetes aquí.</p>
          </div>
        </label>

        <label class="cursor-pointer flex items-center gap-3 p-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-all">
          <input
            [(ngModel)]="form.tieneDelivery"
            type="checkbox"
            class="cursor-pointer w-4 h-4 accent-black rounded"/>
          <div>
            <span class="text-sm font-semibold text-black">Tiene delivery</span>
            <p class="text-xs text-slate-400">La sede realiza entregas a domicilio.</p>
          </div>
        </label>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-100">
      <button
        (click)="onCerrar()"
        class="cursor-pointer px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-sm font-bold hover:bg-slate-50 transition-all">
        Cancelar
      </button>
      <button
        (click)="guardar()"
        [disabled]="guardando()"
        class="cursor-pointer bg-black text-white px-5 py-2 rounded-xl text-sm font-bold hover:bg-slate-800 transition-all flex items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
        @if (guardando()) {
          <i class="fa fa-spinner fa-spin"></i> Guardando...
        } @else {
          <i class="fa fa-floppy-disk"></i> {{ modoEditar ? 'Actualizar' : 'Crear sede' }}
        }
      </button>
    </div>

  </div>
</div>
