<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm cursor-pointer" (click)="onCerrar()"></div>

  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">

    <!-- HEADER -->
    <div class="flex items-center justify-between p-6 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-slate-900 rounded-xl flex items-center justify-center">
          <i class="fa fa-motorcycle text-white text-sm"></i>
        </div>
        <div>
          <h3 class="text-base font-extrabold text-black">Nueva solicitud de delivery</h3>
          <p class="text-xs text-slate-400 mt-0.5">El paquete será entregado en el domicilio indicado.</p>
        </div>
      </div>
      <button (click)="onCerrar()"
        class="cursor-pointer p-2 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-black transition-all">
        <i class="fa fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- BODY -->
    <div class="p-6 flex flex-col gap-4">

      @if (errorMsg()) {
        <div class="p-3 bg-red-50 border border-red-200 rounded-xl flex items-center gap-2 text-red-700 text-xs font-medium">
          <i class="fa fa-circle-exclamation text-red-400"></i> {{ errorMsg() }}
        </div>
      }

      <!-- SEDE -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">
          Sede que entrega <span class="text-red-400">*</span>
        </label>
        <select [(ngModel)]="form.sedeId"
          class="cursor-pointer px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all bg-white">
          <option [value]="0">Seleccionar...</option>
          @for (sede of sedesConDelivery; track sede.id) {
            <option [value]="sede.id">{{ sede.nombre }} — {{ sede.provincia }}</option>
          }
        </select>
      </div>

      <!-- N° ENVÍO -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">
          Código de envío <span class="text-red-400">*</span>
        </label>
        <input [(ngModel)]="form.codigoEnvio" type="text" maxlength="6"
          placeholder="Ej: 048321"
          class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all font-mono tracking-widest"/>
        <p class="text-xs text-slate-400">
          <i class="fa fa-circle-info mr-1"></i>
          Código de 6 dígitos que aparece en tu comprobante de envío.
        </p>
      </div>

      <!-- QUIEN RECIBE -->
      <p class="text-xs font-extrabold text-slate-400 uppercase tracking-wide">
        <i class="fa fa-user mr-1"></i> Quien solicita el delivery
      </p>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">
            Nombre <span class="text-red-400">*</span>
          </label>
          <input [(ngModel)]="form.nombreSolicitante" type="text" placeholder="Nombre completo"
            class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">
            DNI <span class="text-red-400">*</span>
          </label>
          <input [(ngModel)]="form.dniSolicitante" type="text" maxlength="8" placeholder="12345678"
            class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
        </div>
        <div class="flex flex-col gap-1.5 col-span-2">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">
            Teléfono <span class="text-red-400">*</span>
          </label>
          <input [(ngModel)]="form.telefono" type="text" placeholder="999 888 777"
            class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
        </div>
      </div>

      <!-- PERSONA ALTERNATIVA -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">
            Nombre de quien recibe
            <span class="text-slate-400 normal-case font-normal">— si es diferente</span>
          </label>
          <input [(ngModel)]="form.nombrePersonaRecibe" type="text" placeholder="Nombre"
            class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">DNI de quien recibe</label>
          <input [(ngModel)]="form.dniPersonaRecibe" type="text" maxlength="8" placeholder="DNI"
            class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
        </div>
      </div>

      <!-- DIRECCIÓN -->
      <p class="text-xs font-extrabold text-slate-400 uppercase tracking-wide">
        <i class="fa fa-location-dot mr-1"></i> Dirección de entrega
      </p>
      <div class="flex flex-col gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">
            Dirección <span class="text-red-400">*</span>
          </label>
          <input [(ngModel)]="form.direccion" type="text" placeholder="Jr. Los Pinos 234"
            class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Referencia</label>
          <input [(ngModel)]="form.referencia" type="text" placeholder="Frente al parque"
            class="px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-black focus:ring-2 focus:ring-slate-100 transition-all"/>
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-100">
      <button (click)="onCerrar()"
        class="cursor-pointer px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-sm font-bold hover:bg-slate-50 transition-all">
        Cancelar
      </button>
      <button (click)="guardar()" [disabled]="guardando()"
        class="cursor-pointer bg-black text-white px-5 py-2 rounded-xl text-sm font-bold hover:bg-slate-800 transition-all flex items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
        @if (guardando()) { <i class="fa fa-spinner fa-spin"></i> Guardando... }
        @else { <i class="fa fa-floppy-disk"></i> Registrar delivery }
      </button>
    </div>

  </div>
</div>
